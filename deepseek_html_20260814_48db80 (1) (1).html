<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sales Activity Manager</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #dbeafe;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.07),0 2px 4px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px rgba(0,0,0,0.1),0 4px 6px rgba(0,0,0,0.05);
    --shadow-xl: 0 20px 40px rgba(0,0,0,0.15);
    --radius: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-2xl: 24px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--gray-100);color:var(--gray-800);min-height:100vh;font-size:14px;line-height:1.5;}

  .app-container{min-height:100vh;display:flex;flex-direction:column;}
  .top-nav{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
  .nav-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;color:var(--primary);}
  .nav-brand-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;box-shadow:0 2px 8px rgba(37,99,235,.3);}
  .nav-user{display:flex;align-items:center;gap:10px;}
  .nav-user-name{font-size:13px;font-weight:600;color:var(--gray-700);}
  .nav-user-role{font-size:11px;color:var(--gray-500);background:var(--gray-100);padding:2px 10px;border-radius:20px;border:1px solid var(--gray-200);}
  .btn-logout{background:none;border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:600;color:var(--gray-600);cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .btn-logout:hover{background:var(--danger-light);border-color:var(--danger);color:var(--danger);}
  .app-body{display:flex;flex:1;}

  .sidebar{width:230px;background:var(--white);border-left:1px solid var(--gray-200);padding:20px 0;min-height:calc(100vh - 60px);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;flex-shrink:0;}
  .sidebar-section{margin-bottom:6px;}
  .sidebar-label{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.08em;padding:10px 18px 5px;}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;transition:all .15s;color:var(--gray-600);font-size:13px;font-weight:500;margin:1px 8px;border-radius:var(--radius);}
  .sidebar-item:hover{background:var(--gray-50);color:var(--primary);}
  .sidebar-item.active{background:var(--primary-light);color:var(--primary);font-weight:700;box-shadow:0 1px 4px rgba(37,99,235,.15);}
  .sidebar-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .15s;}
  .sidebar-item:hover .sidebar-icon{background:var(--primary-light);}
  .sidebar-item.active .sidebar-icon{background:var(--primary);color:white;}
  .main-content{flex:1;padding:28px;overflow-x:hidden;}

  /* LOGIN */
  .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#0f172a;}
  .login-bg{position:absolute;inset:0;overflow:hidden;}
  .login-bg-circle{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;}
  .login-bg-circle:nth-child(1){width:500px;height:500px;background:radial-gradient(circle,#3b82f6,transparent);top:-100px;right:-100px;}
  .login-bg-circle:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,#7c3aed,transparent);bottom:-80px;left:-80px;}
  .login-bg-circle:nth-child(3){width:300px;height:300px;background:radial-gradient(circle,#06b6d4,transparent);top:50%;left:50%;transform:translate(-50%,-50%);}
  .login-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-2xl);padding:44px 36px;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 25px 50px rgba(0,0,0,.4);}
  .login-logo{text-align:center;margin-bottom:36px;}
  .login-logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:20px;box-shadow:0 8px 24px rgba(37,99,235,.5);}
  .login-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:6px;}
  .login-subtitle{font-size:13px;color:rgba(255,255,255,.5);}
  .login-form-label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
  .login-input-wrap{position:relative;margin-bottom:16px;}
  .login-input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);pointer-events:none;}
  .login-input{width:100%;padding:13px 44px 13px 16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);border-radius:var(--radius-lg);font-size:14px;font-family:inherit;color:#fff;outline:none;transition:all .25s;}
  .login-input:focus{border-color:rgba(99,102,241,.7);background:rgba(99,102,241,.1);box-shadow:0 0 0 3px rgba(99,102,241,.2);}
  .login-input::placeholder{color:rgba(255,255,255,.25);}
  .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);border:none;border-radius:var(--radius-lg);font-size:15px;font-weight:700;color:white;cursor:pointer;transition:all .25s;font-family:inherit;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,.5);}

  /* FORMS */
  .form-group{margin-bottom:20px;}
  .form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
  .form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-300);border-radius:var(--radius);font-size:14px;font-family:inherit;transition:all .2s;background:var(--white);color:var(--gray-800);outline:none;}
  .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .form-control::placeholder{color:var(--gray-400);}
  select.form-control{cursor:pointer;}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .form-col{flex:1;min-width:180px;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;text-decoration:none;white-space:nowrap;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#4f46e5);color:white;box-shadow:0 2px 8px rgba(37,99,235,.3);}
  .btn-primary:hover{background:linear-gradient(135deg,var(--primary-dark),#4338ca);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4);}
  .btn-danger{background:var(--danger);color:white;}
  .btn-danger:hover{background:#b91c1c;}
  .btn-outline{background:var(--white);border:1.5px solid var(--gray-200);color:var(--gray-700);}
  .btn-outline:hover{background:var(--gray-50);border-color:var(--gray-300);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-lg{padding:14px 28px;font-size:16px;}

  /* CARDS */
  .card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-200);margin-bottom:20px;}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  .card-title{font-size:16px;font-weight:700;color:var(--gray-800);display:flex;align-items:center;gap:8px;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-200);text-align:center;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#7c3aed);opacity:0;transition:opacity .2s;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .stat-card:hover::before{opacity:1;}
  .stat-icon{width:48px;height:48px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px;}
  .stat-value{font-size:28px;font-weight:800;color:var(--gray-900);line-height:1;margin-bottom:4px;}
  .stat-label{font-size:12px;color:var(--gray-500);font-weight:500;}

  .progress-bar{width:100%;height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;margin:6px 0;}
  .progress-fill{height:100%;border-radius:4px;transition:width .5s ease;background:linear-gradient(90deg,var(--success),#22c55e);}

  .table-wrapper{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:var(--gray-50);padding:10px 14px;text-align:right;font-size:11px;font-weight:700;color:var(--gray-500);border-bottom:1px solid var(--gray-200);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700);vertical-align:middle;}
  tbody tr:hover{background:var(--gray-50);}
  tbody tr:last-child td{border-bottom:none;}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-active{background:var(--success-light);color:var(--success);}
  .badge-inactive{background:var(--danger-light);color:var(--danger);}
  .badge-pending{background:var(--warning-light);color:var(--warning);}
  .badge-info{background:var(--primary-light);color:var(--primary);}
  .badge-gray{background:var(--gray-100);color:var(--gray-600);}

  .alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .alert-success{background:var(--success-light);color:var(--success);border:1px solid #bbf7d0;}
  .alert-error{background:var(--danger-light);color:var(--danger);border:1px solid #fecaca;}
  .alert-info{background:var(--primary-light);color:var(--primary);border:1px solid #bfdbfe;}
  .alert-warning{background:var(--warning-light);color:var(--warning);border:1px solid #fde68a;}

  .toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;min-width:260px;max-width:380px;}
  .toast{padding:13px 20px;border-radius:var(--radius-lg);font-size:14px;font-weight:600;box-shadow:var(--shadow-xl);animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;}
  .toast-success{background:linear-gradient(135deg,#16a34a,#15803d);color:white;}
  .toast-error{background:linear-gradient(135deg,#dc2626,#b91c1c);color:white;}
  .toast-info{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;}
  .toast-warning{background:linear-gradient(135deg,#d97706,#b45309);color:white;}
  .toast-icon{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--white);border-radius:var(--radius-xl);padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);animation:slideDown .3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes slideDown{from{opacity:0;transform:translateY(-20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-title{font-size:18px;font-weight:700;color:var(--gray-900);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .modal-title-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--primary-light);}
  .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--gray-200);flex-wrap:wrap;}

  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:20px;font-weight:800;color:var(--gray-900);display:flex;align-items:center;gap:10px;}
  .page-title-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,var(--primary-light),#ede9fe);}
  .page-subtitle{font-size:13px;color:var(--gray-500);margin-top:3px;}

  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-row .form-control{flex:1;min-width:140px;max-width:200px;}

  /* ═══════ COMMERCIAL - NEW MODERN DESIGN ═══════ */
  
  .commercial-header{background:linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#7c3aed 100%);border-radius:var(--radius-xl);padding:28px;color:white;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(37,99,235,.35);}
  .commercial-header::before{content:'';position:absolute;top:-40px;left:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);}
  .commercial-header::after{content:'';position:absolute;bottom:-60px;right:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.04);}
  .commercial-greeting{font-size:14px;opacity:.8;margin-bottom:4px;}
  .commercial-name{font-size:24px;font-weight:800;margin-bottom:18px;}
  .commercial-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .commercial-meta-item{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);}
  .commercial-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .commercial-stat{background:rgba(255,255,255,.12);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid rgba(255,255,255,.08);}
  .commercial-stat-value{font-size:24px;font-weight:800;display:block;line-height:1;}
  .commercial-stat-label{font-size:11px;opacity:.75;margin-top:4px;display:block;font-weight:500;}

  /* Client Cards - Modern Grid */
  .client-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:8px;}
  
  .client-card{background:var(--white);border-radius:var(--radius-xl);border:1.5px solid var(--gray-200);overflow:hidden;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-sm);}
  .client-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .client-card.expanded{border-color:var(--primary);box-shadow:0 8px 24px rgba(37,99,235,.15);}
  
  .client-card-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;transition:background .2s;}
  .client-card-header:hover{background:var(--gray-50);}
  
  .client-avatar{width:52px;height:52px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:linear-gradient(135deg,var(--primary-light),#ede9fe);}
  .client-avatar .icon{font-size:26px;}
  
  .client-info{flex:1;min-width:0;}
  .client-name{font-size:16px;font-weight:700;color:var(--gray-900);}
  .client-sub{font-size:12px;color:var(--gray-400);margin-top:2px;display:flex;align-items:center;gap:6px;}
  
  .client-stats{display:flex;gap:12px;align-items:center;flex-shrink:0;}
  .client-stat-item{text-align:center;padding:4px 8px;}
  .client-stat-item .num{font-size:15px;font-weight:700;color:var(--gray-700);display:block;}
  .client-stat-item .lbl{font-size:9px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;}
  
  .client-toggle{width:32px;height:32px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .3s;flex-shrink:0;color:var(--gray-500);}
  .client-card.expanded .client-toggle{transform:rotate(180deg);background:var(--primary-light);color:var(--primary);}
  
  .client-products{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.34,1.56,.64,1),padding .3s ease;padding:0 20px;}
  .client-card.expanded .client-products{max-height:2000px;padding:0 20px 20px 20px;}
  
  .product-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:8px;border-radius:var(--radius-lg);background:var(--gray-50);border:1px solid var(--gray-100);transition:all .2s;}
  .product-item:hover{background:var(--white);border-color:var(--gray-200);}
  .product-item.pending{border-right:4px solid var(--warning);}
  .product-item.active{border-right:4px solid var(--success);background:var(--success-light);}
  .product-item.inactive{border-right:4px solid var(--danger);background:var(--danger-light);}
  
  .product-info{display:flex;align-items:center;gap:10px;}
  .product-icon{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--white);box-shadow:var(--shadow-sm);}
  .product-name{font-size:14px;font-weight:600;color:var(--gray-800);}
  .product-status{font-size:11px;font-weight:500;margin-right:8px;}
  
  .product-actions{display:flex;gap:6px;flex-shrink:0;}
  
  .btn-action{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;}
  .btn-action:hover{transform:scale(1.04);}
  .btn-action:active{transform:scale(.96);}
  .btn-action.active{background:linear-gradient(135deg,#16a34a,#15803d);color:white;box-shadow:0 2px 8px rgba(22,163,74,.3);}
  .btn-action.active:hover{box-shadow:0 4px 12px rgba(22,163,74,.4);}
  .btn-action.active.current{opacity:.5;transform:none;cursor:default;box-shadow:none;}
  .btn-action.inactive{background:linear-gradient(135deg,#dc2626,#b91c1c);color:white;box-shadow:0 2px 8px rgba(220,38,38,.3);}
  .btn-action.inactive:hover{box-shadow:0 4px 12px rgba(220,38,38,.4);}
  .btn-action.inactive.current{opacity:.5;transform:none;cursor:default;box-shadow:none;}
  .btn-action .icon{font-size:12px;}

  .sync-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .sync-info{font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px;font-weight:500;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
  .sync-dot.offline{background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#7c3aed);display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0;}

  .empty-state{text-align:center;padding:48px 20px;}
  .empty-state-icon{font-size:48px;margin-bottom:16px;display:block;}
  .empty-state-title{font-size:16px;font-weight:700;color:var(--gray-600);margin-bottom:6px;}
  .empty-state-desc{font-size:13px;color:var(--gray-400);}

  .offline-bar{background:linear-gradient(135deg,#dc2626,#b91c1c);color:white;text-align:center;padding:9px;font-size:13px;font-weight:600;display:none;}
  .offline-bar.show{display:block;}
  .pending-count{background:var(--warning);color:white;border-radius:20px;font-size:10px;font-weight:700;padding:2px 7px;}

  .page{animation:pageIn .2s ease;}
  @keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* Commercial Search */
  .commercial-search-bar{background:var(--white);border-radius:var(--radius-lg);border:1.5px solid var(--gray-200);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm);}
  .commercial-search-bar input{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--gray-800);background:transparent;}
  .commercial-search-bar input::placeholder{color:var(--gray-400);}
  .commercial-search-icon{color:var(--gray-400);flex-shrink:0;}
  .commercial-search-clear{background:var(--gray-100);border:none;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--gray-500);cursor:pointer;font-family:inherit;}
  .commercial-search-clear:hover{background:var(--gray-200);}

  @media(max-width:768px){
    .sidebar{display:none;}
    .main-content{padding:14px;}
    .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .commercial-stats-row{grid-template-columns:repeat(2,1fr);}
    .page-header{flex-direction:column;align-items:flex-start;}
    .filter-row .form-control{max-width:100%;}
    .modal{padding:20px;}
    table{font-size:12px;}
    thead th,tbody td{padding:8px 10px;}
    .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--gray-200);z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
    .mobile-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;color:var(--gray-400);font-size:10px;font-weight:600;transition:color .2s;gap:3px;}
    .mobile-nav-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;}
    .mobile-nav-item.active{color:var(--primary);}
    .mobile-nav-item.active .mobile-nav-icon{background:var(--primary-light);}
    .app-body{padding-bottom:70px;}
    .client-card-header{padding:14px 16px;flex-wrap:wrap;}
    .client-stats{gap:8px;}
    .client-stat-item .num{font-size:13px;}
    .product-item{flex-wrap:wrap;gap:8px;}
    .product-actions{width:100%;justify-content:flex-start;}
    .btn-action{padding:5px 12px;font-size:11px;}
  }
  @media(min-width:769px){.mobile-nav{display:none;}}
  .hidden{display:none!important;}
  .text-center{text-align:center;}
  .text-success{color:var(--success);}
  .text-danger{color:var(--danger);}
  .text-muted{color:var(--gray-500);}
</style>
</head>

<script>
/* ══════ DB ══════ */
const DB_KEY='sam_v6';
function initDB(){
  if(!localStorage.getItem(DB_KEY)){
    saveDB({users:[{id:'u1',username:'superviseur',password:'admin123',role:'supervisor',name:'المشرف العام',created_at:now()}],
      salesmen:[],regions:[],clients:[],products:[],daily_assignments:[],assignment_items:[],activity_logs:[],sync_queue:[],last_sync:null});
  }
  const db=getDB();
  ['users','salesmen','regions','clients','products','daily_assignments','assignment_items','activity_logs','sync_queue'].forEach(t=>{if(!db[t])db[t]=[];});
  if(db.last_sync===undefined)db.last_sync=null;saveDB(db);
}
function getDB(){return JSON.parse(localStorage.getItem(DB_KEY)||'{}');}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function uid(){return'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,8);}
function now(){return new Date().toISOString();}
function algeriaDate(){return new Intl.DateTimeFormat('fr-CA',{timeZone:'Africa/Algiers',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function fmtDate(s){if(!s)return'—';try{return new Date(s).toLocaleDateString('ar-DZ',{timeZone:'Africa/Algiers',year:'numeric',month:'short',day:'numeric'});}catch{return s;}}
function fmtDT(s){if(!s)return'—';try{return new Date(s).toLocaleString('ar-DZ',{timeZone:'Africa/Algiers',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return s;}}

/* ══════ AUTH ══════ */
let CU=null;
function login(){
  const u=document.getElementById('loginUsername').value.trim();
  const p=document.getElementById('loginPassword').value;
  if(!u||!p){loginAlert('الرجاء إدخال البيانات','error');return;}
  const db=getDB();const user=db.users.find(x=>x.username===u&&x.password===p);
  if(!user){loginAlert('اسم المستخدم أو كلمة المرور غير صحيحة','error');return;}
  CU=user;sessionStorage.setItem('sam_cu',JSON.stringify(user));startApp(user);
}
function logout(){
  CU=null;sessionStorage.removeItem('sam_cu');
  document.getElementById('appContainer').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginUsername').value='';document.getElementById('loginPassword').value='';
}
function checkSession(){
  const s=sessionStorage.getItem('sam_cu');if(!s)return false;
  const u=JSON.parse(s);const db=getDB();const fresh=db.users.find(x=>x.id===u.id);if(!fresh)return false;
  CU=fresh;startApp(fresh);return true;
}
function loginAlert(msg,type){
  const el=document.getElementById('loginAlert');
  el.innerHTML=`<div class="alert alert-${type}" style="margin-bottom:16px;">${msg}</div>`;
  setTimeout(()=>{el.innerHTML='';},4000);
}

/* ══════ START ══════ */
function startApp(user){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appContainer').classList.remove('hidden');
  document.getElementById('navUserName').textContent=user.name||user.username;
  document.getElementById('navUserRole').textContent=user.role==='supervisor'?'مشرف':'مندوب';
  if(user.role==='supervisor'){
    document.getElementById('sidebar').style.display='';
    document.getElementById('mobileNav').style.display='';
    navigate('dashboard');
  } else {
    document.getElementById('sidebar').style.display='none';
    document.getElementById('mobileNav').style.display='none';
    navigate('commercial');
  }
  setupOffline();processSyncQueue();
}

/* ══════ NAV ══════ */
let PAGE='';
function navigate(page){
  PAGE=page;
  document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
  const si=document.querySelector(`.sidebar-item[data-page="${page}"]`);if(si)si.classList.add('active');
  document.querySelectorAll('.mobile-nav-item').forEach(el=>el.classList.remove('active'));
  const mi=document.querySelector(`.mobile-nav-item[data-mob="${page}"]`);if(mi)mi.classList.add('active');
  const pages={dashboard:renderDashboard,assignments:renderAssignments,'create-assignment':()=>renderCreateAssignment(),
    results:renderResults,logs:renderLogs,salesmen:renderSalesmen,clients:renderClients,
    products:renderProducts,regions:renderRegions,commercial:renderCommercial};
  document.getElementById('mainContent').innerHTML='';
  if(pages[page])pages[page]();
}

/* ══════ TOAST ══════ */
function toast(msg,type='success',ms=3000){
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');el.className=`toast toast-${type}`;
  const ic={success:'✓',error:'✕',info:'i',warning:'!'};
  el.innerHTML=`<div class="toast-icon">${ic[type]||'•'}</div><span>${msg}</span>`;
  c.appendChild(el);setTimeout(()=>el.remove(),ms);
}

/* ══════ MODAL ══════ */
function showModal(html){document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="overlayClose(event)">${html}</div>`;}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}
function overlayClose(e){if(e.target===e.currentTarget)closeModal();}

/* ══════ OFFLINE ══════ */
let ONLINE=navigator.onLine;
function setupOffline(){
  window.addEventListener('online',()=>{ONLINE=true;document.getElementById('offlineBar').classList.remove('show');processSyncQueue();toast('تم استعادة الاتصال','success');});
  window.addEventListener('offline',()=>{ONLINE=false;document.getElementById('offlineBar').classList.add('show');toast('لا يوجد اتصال — سيتم الحفظ محلياً','warning');});
}
function processSyncQueue(){
  const db=getDB();const q=db.sync_queue||[];
  if(q.length>0){const n=q.length;db.sync_queue=[];db.last_sync=now();saveDB(db);toast(`تمت مزامنة ${n} تغيير(ات)`,'success');}
  else{db.last_sync=now();saveDB(db);}
}
function manualSync(){
  const db=getDB();db.last_sync=now();saveDB(db);toast('تمت المزامنة بنجاح','success');
  if(PAGE==='commercial')renderCommercial();else if(PAGE==='dashboard')renderDashboard();
}

/* ══════ HELPERS ══════ */
function statusBadge(s){
  if(s==='ACTIVE')return'<span class="badge badge-active">● ACTIVE</span>';
  if(s==='INACTIVE')return'<span class="badge badge-inactive">● NON ACTIVE</span>';
  return'<span class="badge badge-pending">○ بانتظار</span>';
}
function pct(done,total){return total>0?Math.round((done/total)*100):0;}
function progressBar(p,h='8px'){return`<div class="progress-bar" style="height:${h}"><div class="progress-fill" style="width:${p}%"></div></div>`;}
function mAlert(msg,type){const el=document.getElementById('mAlert');if(el)el.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;}

/* ══════════════════════════════════════════════════════════
   MULTI-SELECT (minimal for create)
══════════════════════════════════════════════════════════ */
function buildMsHtml(id, items, selected=[], placeholder='بحث...'){
  const selSet=new Set(selected);
  const listHtml=items.length?items.map(item=>`
  <label class="multi-select-item ${selSet.has(item.id)?'selected':''}" data-id="${item.id}" data-label="${(item.label||'').toLowerCase()}">
    <input type="checkbox" value="${item.id}" ${selSet.has(item.id)?'checked':''} onchange="msTick2(this,'${id}')">
    <div style="flex:1;">
      <div style="font-weight:500;">${item.label}</div>
      ${item.sub?`<div style="font-size:11px;color:var(--gray-400);">${item.sub}</div>`:''}
    </div>
  </label>`).join(''):
  '<div class="multi-select-empty">لا توجد عناصر</div>';

  return`<div class="multi-select-wrapper" id="ms_${id}_wrap">
    <div class="multi-select-controls">
      <button class="btn btn-outline btn-sm" onclick="msSelectAll2('${id}')">تحديد الكل</button>
      <button class="btn btn-outline btn-sm" onclick="msSelectNone2('${id}')">إلغاء الكل</button>
    </div>
    <div class="multi-select-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gray-400);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="${placeholder}" oninput="msFilter2(this,'${id}')" autocomplete="off" style="flex:1;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;">
      <button onclick="msClear2('${id}')" style="background:var(--gray-100);border:none;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--gray-500);cursor:pointer;" id="ms_${id}_clearBtn">✕</button>
    </div>
    <div class="multi-select-box" id="ms_${id}_list">${listHtml}</div>
    <div class="multi-select-count" id="ms_${id}_count">
      <span>إجمالي: ${items.length}</span>
      <span id="ms_${id}_selCount" style="color:var(--primary);font-weight:700;">${selSet.size} محدد</span>
    </div>
  </div>`;
}
function msFilter2(input,id){
  const q=(input.value||'').toLowerCase().trim();
  const clearBtn=document.getElementById(`ms_${id}_clearBtn`);

function msSelectNone2(id){
  document.querySelectorAll(`#ms_${id}_list .multi-select-item`).forEach(el=>{

function msUpdateCount2(id){

function msGetSelected2(id){

function smDetail(smId){

function doCreateAsgn(){
  const smId=document.getElementById('ca_sm').value;const rgId=document.getElementById('ca_rg').value;
  const dt=document.getElementById('ca_dt').value;
  const cl=msGetSelected2('ca_cl');const pr=msGetSelected2('ca_pr');
  if(!smId||!rgId||!dt){toast('الرجاء تحديد جميع الحقول','error');return;}
  if(!cl.length){toast('اختر زبون واحد على الأقل','error');return;}
  if(!pr.length){toast('اختر منتج واحد على الأقل','error');return;}
  const db=getDB();let asgnId;
  const exist=db.daily_assignments.find(a=>a.salesman_id===smId&&a.work_date===dt&&a.region_id===rgId);
  if(exist){if(!confirm('يوجد برنامج لهذا المندوب في نفس اليوم والمنطقة. إضافة مهام جديدة؟'))return;asgnId=exist.id;}
  else{asgnId=uid();db.daily_assignments.push({id:asgnId,salesman_id:smId,region_id:rgId,work_date:dt,created_by:CU.id,created_at:now()});}
  let newC=0,skipC=0;
  cl.forEach(cId=>{pr.forEach(pId=>{
    const dup=db.assignment_items.find(i=>i.assignment_id===asgnId&&i.client_id===cId&&i.product_id===pId);
    if(!dup){db.assignment_items.push({id:uid(),assignment_id:asgnId,client_id:cId,product_id:pId,status:null,created_at:now(),updated_at:null,updated_by:null});newC++;}
    else skipC++;
  });});
  saveDB(db);toast(`تم إنشاء ${newC} مهمة${skipC>0?' ('+skipC+' موجودة)':''}`,'success');navigate('assignments');
}
function editAsgn(id){window._caEditCl=[];renderCreateAssignment(id);}
function doUpdateAsgn(id){
  const smId=document.getElementById('ca_sm').value;const rgId=document.getElementById('ca_rg').value;
  const dt=document.getElementById('ca_dt').value;
  const cl=msGetSelected2('ca_cl');const pr=msGetSelected2('ca_pr');
  if(!smId||!rgId||!dt){toast('الرجاء تحديد جميع الحقول','error');return;}
  const db=getDB();const a=db.daily_assignments.find(x=>x.id===id);if(!a)return;
  a.salesman_id=smId;a.region_id=rgId;a.work_date=dt;a.updated_at=now();
  let newC=0;
  cl.forEach(cId=>{pr.forEach(pId=>{
    const dup=db.assignment_items.find(i=>i.assignment_id===id&&i.client_id===cId&&i.product_id===pId);
    if(!dup){db.assignment_items.push({id:uid(),assignment_id:id,client_id:cId,product_id:pId,status:null,created_at:now(),updated_at:null,updated_by:null});newC++;}
  });});
  saveDB(db);toast(`تم تحديث البرنامج — ${newC} مهمة جديدة`,'success');navigate('assignments');
}

function renderResults(){
  const db=getDB();const today=algeriaDate();
  const smOpts=(db.salesmen||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');

        </select>

      </div>
      <div id="resContent"></div>
    </div>
  </div>`;loadRes();
}
function loadRes(){
  const db=getDB();
  const fd=document.getElementById('rf_dt').value;const fs=document.getElementById('rf_sm').value;
  const fr=document.getElementById('rf_rg').value;const fst=document.getElementById('rf_st').value;
  const fq=(document.getElementById('rf_q').value||'').toLowerCase();
  let asgns=db.daily_assignments||[];
  if(fd)asgns=asgns.filter(a=>a.work_date===fd);if(fs)asgns=asgns.filter(a=>a.salesman_id===fs);
  if(fr)asgns=asgns.filter(a=>a.region_id===fr);
  const ids=asgns.map(a=>a.id);
  let items=(db.assignment_items||[]).filter(i=>ids.includes(i.assignment_id));
  if(fst==='pending')items=items.filter(i=>!i.status);else if(fst)items=items.filter(i=>i.status===fst);
  if(fq){items=items.filter(i=>{
    const cl=(db.clients||[]).find(c=>c.id===i.client_id);const pr=(db.products||[]).find(p=>p.id===i.product_id);
    const a=asgns.find(x=>x.id===i.assignment_id);const sm=a?(db.salesmen||[]).find(s=>s.id===a.salesman_id):null;
    const rg=a?(db.regions||[]).find(r=>r.id===a.region_id):null;
    return[(cl||{}).name,(pr||{}).name,(sm||{}).name,(rg||{}).name].some(v=>(v||'').toLowerCase().includes(fq));
  });}
  const ac=items.filter(i=>i.status==='ACTIVE').length;const ic=items.filter(i=>i.status==='INACTIVE').length;
  const pc=items.filter(i=>!i.status).length;const tot=items.length;const rate=pct(ac+ic,tot);
  const rows=items.slice(0,300).map(item=>{
    const cl=(db.clients||[]).find(c=>c.id===item.client_id);const pr=(db.products||[]).find(p=>p.id===item.product_id);
    const a=asgns.find(x=>x.id===item.assignment_id);
    const sm=a?(db.salesmen||[]).find(s=>s.id===a.salesman_id):null;const rg=a?(db.regions||[]).find(r=>r.id===a.region_id):null;
    return`<tr><td>${sm?sm.name:'—'}</td><td>${rg?rg.name:'—'}</td><td>${cl?cl.name:'—'}</td><td>${pr?pr.name:'—'}</td><td>${statusBadge(item.status)}</td><td style="font-size:11px;color:var(--gray-400);">${fmtDT(item.updated_at)}</td></tr>`;
  }).join('');
  document.getElementById('resContent').innerHTML=`
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
    <div class="stat-card" style="flex:1;padding:12px;"><div class="stat-value">${tot}</div><div class="stat-label">إجمالي</div></div>
    <div class="stat-card" style="flex:1;padding:12px;"><div class="stat-value text-success">${ac}</div><div class="stat-label">ACTIVE</div></div>
    <div class="stat-card" style="flex:1;padding:12px;"><div class="stat-value text-danger">${ic}</div><div class="stat-label">NON ACTIVE</div></div>
    <div class="stat-card" style="flex:1;padding:12px;"><div class="stat-value" style="color:var(--warning);">${pc}</div><div class="stat-label">بانتظار</div></div>
    <div class="stat-card" style="flex:1;padding:12px;"><div class="stat-value">${rate}%</div><div class="stat-label">الإنجاز</div></div>
  </div>
  ${tot>0?progressBar(rate,'10px'):''}
  ${!tot?`<div class="empty-state"><span class="empty-state-icon">📊</span><div class="empty-state-title">لا توجد نتائج</div></div>`:`
  <div class="table-wrapper" style="margin-top:14px;"><table>
    <thead><tr><th>المندوب</th><th>المنطقة</th><th>الزبون</th><th>المنتج</th><th>الحالة</th><th>آخر تحديث</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>${items.length>300?'<div style="text-align:center;padding:10px;font-size:12px;color:var(--gray-400);">يتم عرض أول 300 نتيجة</div>':''}</div>`}`;
}

function saveSm(){
  const n=document.getElementById('sm_n').value.trim();const u=document.getElementById('sm_u').value.trim();

  if(!n||!u||!p){mAlert('الرجاء ملء جميع الحقول','error');return;}

function updateSm(id){
  const n=document.getElementById('sm_n').value.trim();const ph=document.getElementById('sm_ph').value.trim();const p=document.getElementById('sm_p').value;
  if(!n){mAlert('الاسم مطلوب','error');return;}

function delSm(id){

function buildClientCards(items, db, sm){
  if(!items.length) return '';
  
  // Group by client
  const grouped={};
  items.forEach(item=>{
    const cl=db.clients.find(c=>c.id===item.client_id);
    if(!cl) return;
    const key=item.client_id;
    if(!grouped[key]){grouped[key]={client:cl, products:[]};}
    grouped[key].products.push(item);
  });

  // Sort clients by name
  const sortedKeys=Object.keys(grouped).sort((a,b)=>grouped[a].client.name.localeCompare(grouped[b].client.name));

  let html='';
  sortedKeys.forEach(key=>{
    const group=grouped[key];
    const cl=group.client;
    const products=group.products;
    const total=products.length;
    const active=products.filter(p=>p.status==='ACTIVE').length;
    const inactive=products.filter(p=>p.status==='INACTIVE').length;
    const pending=products.filter(p=>!p.status).length;
    
    html+=`
    <div class="client-card" id="cc_${cl.id}">
      <div class="client-card-header" onclick="toggleClient('${cl.id}')">
        <div class="client-avatar"><span class="icon">🏢</span></div>
        <div class="client-info">
          <div class="client-name">${cl.name}</div>
          <div class="client-sub">
            <span>📦 ${total} منتج</span>
            ${cl.address?`<span>📍 ${cl.address}</span>`:''}
          </div>
        </div>
        <div class="client-stats">
          <div class="client-stat-item"><span class="num">${active}</span><span class="lbl">ACTIVE</span></div>
          <div class="client-stat-item"><span class="num">${inactive}</span><span class="lbl">NON ACTIVE</span></div>
          <div class="client-stat-item"><span class="num" style="color:var(--warning);">${pending}</span><span class="lbl">بانتظار</span></div>
        </div>
        <div class="client-toggle">▼</div>
      </div>
      <div class="client-products">
        ${products.map(p=>{
          const pr=db.products.find(x=>x.id===p.product_id);
          const prName=pr?pr.name:'منتج غير معروف';
          const isAc=p.status==='ACTIVE';
          const isIn=p.status==='INACTIVE';
          const isPending=!p.status;
          let cls='product-item';
          if(isAc) cls+=' active';
          else if(isIn) cls+=' inactive';
          else cls+=' pending';
          
          return`
          <div class="${cls}">
            <div class="product-info">
              <div class="product-icon">📦</div>
              <div>
                <div class="product-name">${prName}</div>
                <div class="product-status">${statusBadge(p.status)}</div>
              </div>
            </div>
            <div class="product-actions">
              <button class="btn-action active ${isAc?'current':''}" onclick="setStatusModern('${p.id}','ACTIVE','${sm.id}')">
                <span class="icon">●</span> ACTIVE
              </button>
              <button class="btn-action inactive ${isIn?'current':''}" onclick="setStatusModern('${p.id}','INACTIVE','${sm.id}')">
                <span class="icon">●</span> NON ACTIVE
              </button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  return html;
}

function toggleClient(clientId){
  const card=document.getElementById(`cc_${clientId}`);
  if(card)card.classList.toggle('expanded');
}

function commercialSearchModern(){
  const q=document.getElementById('comm_search').value;
  const clearBtn=document.getElementById('comm_clear');if(clearBtn)clearBtn.style.display=q?'':'none';
  window._commSearch=q;
  filterClientCards(q);
}

function commercialClearSearchModern(){
  const inp=document.getElementById('comm_search');if(inp)inp.value='';
  const clearBtn=document.getElementById('comm_clear');if(clearBtn)clearBtn.style.display='none';
  window._commSearch='';
  filterClientCards('');
}

function filterClientCards(q){
  const items=window._commItems||[];
  const db=window._commDb||getDB();
  const sm=window._commSm;
  if(!items.length)return;
  
  const qLower=(q||'').toLowerCase();
  const filtered=items.filter(i=>{
    const cl=db.clients.find(c=>c.id===i.client_id);
    const pr=db.products.find(p=>p.id===i.product_id);
    const matchClient=cl&&(cl.name||'').toLowerCase().includes(qLower);
    const matchProduct=pr&&(pr.name||'').toLowerCase().includes(qLower);
    return matchClient||matchProduct;
  });
  
  const grid=document.getElementById('clientGrid');
  if(!grid)return;
  grid.innerHTML=buildClientCards(filtered, db, sm)||`<div class="empty-state"><span class="empty-state-icon">🔍</span>
    <div class="empty-state-title">لا توجد نتائج لـ "${q}"</div>
    <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="commercialClearSearchModern()">مسح البحث</button>
  </div>`;
}

function setStatusModern(itemId,newStatus,smId){
  const db=getDB();const item=db.assignment_items.find(i=>i.id===itemId);if(!item)return;
  const asgn=db.daily_assignments.find(a=>a.id===item.assignment_id);
  if(!asgn||asgn.salesman_id!==smId){toast('غير مصرح بهذه العملية','error');return;}
  const prev=item.status;if(prev===newStatus)return;
  item.status=newStatus;item.updated_at=now();item.updated_by=CU.id;
  db.activity_logs.push({id:uid(),salesman_id:smId,client_id:item.client_id,product_id:item.product_id,
    assignment_id:item.assignment_id,item_id:itemId,prev_status:prev,new_status:newStatus,timestamp:now()});
  if(!ONLINE){db.sync_queue.push({id:uid(),salesman_id:smId,item_id:itemId,status:newStatus,timestamp:now()});}
  else{db.last_sync=now();}
  saveDB(db);
  toast(`تم الحفظ — ${newStatus==='ACTIVE'?'● ACTIVE':'● NON ACTIVE'}`,'success',1500);
  renderCommercial();
}

document.addEventListener('DOMContentLoaded',()=>{
  initDB();
  if(!checkSession()){document.getElementById('loginPage').classList.remove('hidden');}
  ['loginUsername','loginPassword'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('keypress',e=>{if(e.key==='Enter')login();});
  });
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
setInterval(()=>{if(CU&&CU.role==='supervisor'&&PAGE==='dashboard')renderDashboard();},30000);
</script>
</body>
</html>
